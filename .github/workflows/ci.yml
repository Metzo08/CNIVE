name: CNIVE Continuous Integration

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: Backend Lint & Test (FastAPI)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: test-secret-key-for-ci-pipeline-cnive-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 black

    - name: Code Formatting Check (Black)
      run: black --check app main.py

    - name: Lint Check (Flake8)
      run: flake8 app main.py --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero

    - name: Run Backend Tests
      run: |
        python -c "import test_api" 2>&1 | tee /tmp/import.log || (echo "::error::IMPORT_FAILED: $(cat /tmp/import.log | tr '\n' ' ')"; exit 1)
        pytest test_api.py -v -ra --tb=short 2>&1 | tee /tmp/pytest.log || (echo "::error::PYTEST_FAILED: $(tail -n 25 /tmp/pytest.log | tr '\n' ' ')"; exit 1)

  frontend-check:
    name: Frontend Build & Type Check (React/Vite)
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: TypeScript Type Checking
      run: npx tsc --noEmit

    - name: Production Build Check
      run: npm run build
